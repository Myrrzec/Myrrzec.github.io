<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservation | Make Motorworks</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container prose" data-result>
    <h1>Checking your reservation…</h1>
  </main>
  <script type="module">
    import { mountChrome, money, escapeHtml, STORE } from './shop.js';

    mountChrome();
    const root = document.querySelector('[data-result]');
    const id = new URLSearchParams(location.search).get('session_id');

    try {
      if (!id) throw new Error('missing');
      const res = await fetch(`./api/order/${encodeURIComponent(id)}`);
      if (!res.ok) throw new Error('lookup');
      const order = await res.json();
      const carName = order.car ? escapeHtml(order.car.name) : 'your car';

      root.innerHTML = order.paid
        ? `<h1>${order.car ? `The ${carName} is reserved for you.` : 'Your car is reserved.'}</h1>
           <p>We have taken a ${money(order.amount, order.currency)} deposit and the car is off the market.${
             order.email ? ` A receipt is on its way to ${escapeHtml(order.email)}.` : ''
           }</p>
           <p>We will call you within one working day to book a viewing and a test drive. If you would rather call us, we are on ${STORE.phone}.</p>
           <a class="btn btn--line" href="./">Back to inventory</a>`
        : `<h1>Your payment is still processing.</h1>
           <p>Some banks take a few minutes to confirm. You will get an email from us as soon as the deposit goes through, and the car stays held in the meantime.</p>
           <a class="btn btn--line" href="./">Back to inventory</a>`;
    } catch {
      root.innerHTML = `<h1>We could not find this reservation.</h1>
        <p>If money left your account, please call us on ${STORE.phone} or write to ${STORE.email} and we will sort it out.</p>
        <a class="btn btn--line" href="./">Back to inventory</a>`;
    }
  </script>
</body>
</html>
